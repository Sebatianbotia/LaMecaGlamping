      <h1>La Meca Glamping — Glamping y Restaurante Campestre en Guasca, Cundinamarca</h1>
      <p>
        La Meca Glamping es un destino exclusivo ubicado en Guasca, Cundinamarca, a solo una hora de Bogotá.
        Ofrecemos domos geodésicos termoacondicionados con jacuzzi panorámico climatizado para 4 personas,
        vistas a las montañas, fogatas privadas y una experiencia de glamping única en Colombia.
        Somos un espacio pet-friendly donde la gastronomía, la música, el arte y la naturaleza se unen
        para crear momentos inolvidables.
      </p>

      <h2>Alojamiento — Domos Geodésicos con Jacuzzi en Guasca</h2>
      <p>
        Contamos con 2 glampings exclusivos: Patrón 70 y Don Julio. Cada domo geodésico está
        termoacondicionado, equipado con cama doble, sofá, baño privado de gran tamaño y amplia terraza.
        Relájate en nuestro jacuzzi panorámico climatizado para 4 personas contemplando la increíble vista
        a las montañas de Guasca. Precio base: $360.000 COP por noche entre semana y $450.000 COP
        en fin de semana. Persona adicional (más de 2): +$65.000 COP por noche.
        Check-in desde las 2:00 p.m. Check-out antes de las 12:00 m.
      </p>
      <ul>
        <li>Baño de gran tamaño</li>
        <li>Termoacondicionado</li>
        <li>Jacuzzi panorámico climatizado</li>
        <li>Capacidad hasta 4 personas</li>
        <li>Pet-Friendly (cargo adicional de $50.000 por mascota)</li>
        <li>Vista a la montaña</li>
      </ul>

      <h2>Restaurante Campestre en Guasca — Cocina de Autor y Carnes Maduradas</h2>
      <p>
        El restaurante de La Meca Glamping está abierto al público y ofrece una experiencia gastronómica
        única liderada por la Chef Clau, quien durante más de 20 años ha perfeccionado una propuesta de
        cocina de autor. Nuestra especialidad son las carnes maduradas Angus certificado, acompañadas de
        mantequillas compuestas y preparaciones únicas. Más que un restaurante, somos un espacio donde
        la gastronomía, la música, el arte y la naturaleza se unen para convertir cada visita en una
        experiencia inolvidable en Guasca, Cundinamarca.
      </p>

      <h2>Eventos y Celebraciones Privadas en Guasca, Cundinamarca</h2>
      <p>
        En La Meca Glamping organizamos eventos privados exclusivos: pedidas de mano, aniversarios,
        cumpleaños y reuniones corporativas con un toque rústico y exclusivo en las montañas de Guasca.
        Disfruta de música en vivo, fogatas compartidas y atención personalizada en un entorno natural único.
      </p>

      <h2>¿Dónde estamos? Cómo llegar a La Meca Glamping</h2>
      <p>
        La Meca Glamping se encuentra en la Vereda Santa Bárbara, Guasca, Cundinamarca, Colombia,
        a solo 1 hora de Bogotá por la carrera 7 hacia Guasca. Coordina tu llegada con anticipación
